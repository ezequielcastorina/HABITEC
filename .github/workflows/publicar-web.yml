# Publica la versión web (carpeta web/) en GitHub Pages.
# Uso: en el repositorio, Settings > Pages > Source: "GitHub Actions". Después, Actions > "Publicar web" > Run workflow.
# Cada vez que cambie el código (rama main) se vuelve a publicar solo.
name: Publicar web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "sip/**", "puente_web.py", "generar_ejemplo.py", "crear_web.py"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crear_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
